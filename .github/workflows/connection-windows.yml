name: RustDesk Windows connection diagnostic build
'on':
  workflow_dispatch:
    inputs:
      reuse_verified_bridge:
        description: Reuse the verified baseline bridge for the exact diagnostic source only (expires with its artifact)
        type: boolean
        required: false
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: rustdesk-core-${{ github.ref }}
  cancel-in-progress: true
env:
  SCITER_RUST_VERSION: '1.75'
  RUST_VERSION: '1.75'
  LLVM_VERSION: 15.0.6
  FLUTTER_VERSION: 3.24.5
  VCPKG_COMMIT_ID: 9e593bb18ea69cc5095e012465dcd675a822ed0d
  VCPKG_CMAKE_VERSION: 4.3.0
  VERSION: 1.5.1
  VCPKG_BINARY_SOURCES: clear;x-gha,readwrite
  UPLOAD_ARTIFACT: 'true'
  TAG_NAME: ${{ github.sha }}
jobs:
  generate-bridge:
    if: ${{ !inputs.reuse_verified_bridge }}
    uses: ./.github/workflows/bridge.yml
  build-RustDeskTempTopMostWindow:
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    with:
      upload-artifact: true
      target: windows-2022
      configuration: Release
      platform: x64
      target_version: Windows10
  build-for-windows-flutter:
    name: ${{ matrix.job.target }}
    if: ${{ !cancelled() && needs.build-RustDeskTempTopMostWindow.result == 'success' && (needs.generate-bridge.result == 'success' || (inputs.reuse_verified_bridge && needs.generate-bridge.result == 'skipped')) }}
    needs:
    - build-RustDeskTempTopMostWindow
    - generate-bridge
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
        - target: x86_64-pc-windows-msvc
          os: windows-2022
          arch: x86_64
          flutter-arch: x64
          vcpkg-triplet: x64-windows-static
          build-args: --vram
    steps:
    - name: Export GitHub Actions cache environment variables
      uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410
      with:
        script: |
          core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
    - name: Checkout source code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        submodules: recursive
        persist-credentials: false
    - name: Verify source before reusing the baseline bridge
      if: ${{ inputs.reuse_verified_bridge }}
      shell: bash
      run: |
        set -euo pipefail
        BASELINE=b4f03385666c7560183cdde95deda18da3355ce8
        git fetch --no-tags --depth=1 origin "$BASELINE"
        test "$(git rev-parse HEAD:src/client/io_loop.rs)" = c5fbc865c81e767646472d53a8e6db7808f9ad55
        git diff --exit-code "$BASELINE" HEAD -- . ':!.github/workflows/connection-windows.yml' ':!src/client/io_loop.rs'
    - name: Restore bridge files
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: ${{ matrix.job.arch == 'aarch64' && 'bridge-artifact-flutter-3.44' || 'bridge-artifact' }}
        path: ./
        github-token: ${{ github.token }}
        repository: ${{ github.repository }}
        run-id: ${{ inputs.reuse_verified_bridge && '43030010527' || github.run_id }}
    - name: Install LLVM and Clang
      uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0
      with:
        version: ${{ env.LLVM_VERSION }}
    - name: Install flutter
      id: flutter
      uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225
      with:
        channel: stable
        flutter-version: ${{ matrix.job.arch == 'aarch64' && env.FLUTTER_WINDOWS_ARM_VERSION || env.FLUTTER_VERSION }}
        architecture: x64
    - name: Replace engine with rustdesk custom flutter engine
      if: ${{ matrix.job.arch == 'x86_64' }}
      run: |
        flutter doctor -v
        flutter precache --windows
        Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
        if ((Get-FileHash windows-x64-release.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'ec8cabf36ee4ff24c8d98de25b00e70781eb03876265aee84d0fe554a110036e') { throw 'RustDesk Flutter engine SHA256 mismatch' }
        Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
        mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/
    - name: Patch flutter
      if: ${{ matrix.job.arch == 'x86_64' }}
      shell: bash
      run: |
        cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
        cd $(dirname $(dirname $(which flutter)))
        if [[ "3.24.5" == ${{env.FLUTTER_VERSION}} ]]; then
          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff
        fi
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
      with:
        toolchain: ${{ env.SCITER_RUST_VERSION }}
        targets: ${{ matrix.job.target }}
        components: rustfmt
    - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      with:
        prefix-key: ${{ matrix.job.os }}
    - name: Setup vcpkg with Github Actions binary cache
      uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
      with:
        vcpkgDirectory: C:\vcpkg
        vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
        doNotCache: false
    - name: Install vcpkg dependencies
      env:
        VCPKG_DEFAULT_HOST_TRIPLET: ${{ matrix.job.vcpkg-triplet }}
      run: |
        if ! $VCPKG_ROOT/vcpkg \
          install \
          --triplet ${{ matrix.job.vcpkg-triplet }} \
          --x-install-root="$VCPKG_ROOT/installed"; then
          find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
            echo "$_1:"
            echo "======"
            cat "$_1"
            echo "======"
            echo ""
          done
          exit 1
        fi
        head -n 100 "${VCPKG_ROOT}/buildtrees/ffmpeg/build-${{ matrix.job.vcpkg-triplet }}-rel-out.log" || true
      shell: bash
    - name: Build rustdesk
      run: |
        # Windows: build RustDesk
        # --hwcodec is shared by all Windows targets; per-target extras (e.g. --vram) come from the matrix
        python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec ${{ matrix.job.build-args }}
        mv ./flutter/build/windows/${{ matrix.job.flutter-arch }}/runner/Release ./rustdesk
    - name: Run the Rust tests
      shell: bash
      run: |
        # The build's own features, so the tests see the code that ships.
        FEATURES=$(python3 ./build.py --portable --flutter --skip-portable-pack --hwcodec ${{ matrix.job.build-args }} --print-features)
        cargo test --locked --release --lib --features "$FEATURES"
        # Its Windows tests run nowhere else.
        cargo test --locked --release -p clipboard
    - name: Download RustDeskTempTopMostWindow artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: ${{ matrix.job.arch == 'aarch64' && 'topmostwindow-artifacts-ARM64' || 'topmostwindow-artifacts-x64' }}
        path: ./rustdesk
    - name: Record source provenance
      shell: pwsh
      run: |
        $commit = git rev-parse HEAD
        Copy-Item LICENCE rustdesk/LICENCE
        @{ source = 'https://github.com/rustdesk/rustdesk'; baseline = '23e5bb471a040d62f0a6ad52591fb30784265b73'; commit = $commit; build = $env:GITHUB_RUN_ID; diagnostic_build = $true } | ConvertTo-Json | Set-Content rustdesk/source-build.json
    - name: Upload unsigned
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: rustdesk-core-windows-x64
        path: rustdesk
        retention-days: 7
        if-no-files-found: error
    timeout-minutes: 120
  dependency-audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
      with:
        toolchain: 1.99.1
    - name: Install pinned dependency audit tool
      run: cargo install cargo-audit --version 0.23.0 --locked
    - name: Audit dependency lockfile
      id: audit
      run: cargo audit --json > cargo-audit.json
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: ${{ always() }}
      with:
        name: rustdesk-dependency-audit
        path: cargo-audit.json
        retention-days: 7
        if-no-files-found: error
